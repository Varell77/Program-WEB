<!DOCTYPE html>
<html>
<head>
    <title>Lingkaran Bertumpuk</title>
    <style>
        body {
            background: white;
        }

        .container {
            position: relative;
            width: 500px;
            height: 250px;
            margin: 100px auto;
            padding: 20px;
        }

        .circle {
            position: absolute;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 10px solid red;
            background: transparent;
        }

        .c1 {
            left: 50px;
            top: 40px;
            z-index: 3;
        }

        .c2 {
            left: 150px;
            top: 40px;
            border-color: blue;
            z-index: 2;
        }

        .c3 {
            left: 250px;
            top: 40px;
            z-index: 3;
        }

    </style>
</head>
<body>

<div class="container">
    <div class="circle c1"></div>
    <div class="circle c2"></div>
    <div class="circle c3"></div>
</div>

</body>
</html>
