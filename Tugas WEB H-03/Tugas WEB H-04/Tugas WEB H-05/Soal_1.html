<!DOCTYPE html>
<html>
<head>
    <title>Mouse Over</title>
    <style>
        body {
            background: white;
            font-family: Arial;
        }

        table {
            margin: auto;
            margin-top: 80px;
        }

        td {
            padding: 70px;
            text-align: center;
        }

        .img-wrap {
            position: relative;
            display: inline-block;
        }

        img {
            width: 170px;
            display: block;
        }

        .corner {
            position: absolute;
            width: 40px;
            height: 40px;
            border: 5px solid #FF0000;
        }

        .tl { top: -10px; left: -10px; border-right: none; border-bottom: none; }
        .tr { top: -10px; right: -10px; border-left: none; border-bottom: none; }
        .bl { bottom: -10px; left: -10px; border-right: none; border-top: none; }
        .br { bottom: -10px; right: -10px; border-left: none; border-top: none; }

        .img-wrap:hover .corner {
            border-color: #FF00FF;
        }

        .ungu .corner {
            border-color: #FF00FF;
        }

        a {
            text-decoration: none;
        }

        .arrow {
            position: relative;
            display: inline-block;
            padding: 18px 65px 18px 45px;
            font-weight: bold;
            color: blue;
            background: linear-gradient(to right, #dcdcdc, #8BC34A);
            border-radius: 4px;
            box-shadow: 2px 3px 5px rgba(0,0,0,0.2);
        }

        .arrow:after {
            content: "";
            position: absolute;
            top: 50%;
            right: -40px;
            transform: translateY(-50%);
            border-top: 25px solid transparent;
            border-bottom: 25px solid transparent;
            border-left: 40px solid #8BC34A;
        }

        .arrow:before {
            content: "";
            position: absolute;
            top: 50%;
            right: -40px;
            transform: translateY(-50%);
            border-top: 25px solid transparent;
            border-bottom: 25px solid transparent;
            border-left: 40px solid rgba(0,0,0,0.08);
        }

    </style>
</head>
<body>

<table>
    <tr>

        <td>
            <a href="#">
                <div class="img-wrap">
                    <span class="corner tl"></span>
                    <span class="corner tr"></span>
                    <span class="corner bl"></span>
                    <span class="corner br"></span>
                    <img src="https://pngimg.com/uploads/star/star_PNG41474.png">
                </div>
            </a>
        </td>

        <!-- TENGAH -->
        <td>
            <div class="arrow">Mouse over</div>
        </td>

        <!-- KANAN -->
        <td>
            <a href="#">
                <div class="img-wrap ungu">
                    <span class="corner tl"></span>
                    <span class="corner tr"></span>
                    <span class="corner bl"></span>
                    <span class="corner br"></span>
                    <img src="https://pngimg.com/uploads/star/star_PNG41474.png">
                </div>
            </a>
        </td>
    </tr>
</table>

</body>
</html>
