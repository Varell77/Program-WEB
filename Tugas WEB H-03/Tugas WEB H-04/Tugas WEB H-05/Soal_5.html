<!DOCTYPE html>
<html>
<head>
    <title>Navigation Bar</title>
    <style>
        body {
            font-family: "Times New Roman";
        }

        ul {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .menu {
            margin: 20px;
        }

        .menu > li {
            display: inline-block;
            position: relative;
            margin-right: 3px;
        }

        .menu > li > a {
            display: block;
            width: 120px;
            padding: 8px 0;
            text-align: center;
            text-decoration: none;
            color: black;
            border: 2px dotted grey;
        }

        .menu > li > a:hover {
            background: black;
            color: white;
        }

        .submenu {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
        }

        .submenu li {
            margin-top: 3px;
        }

        .submenu li a {
            display: block;
            width: 120px;
            padding: 8px 0;
            text-align: center;
            text-decoration: none;
            color: black;
            border: 2px dotted grey;
        }

        .submenu li a:hover {
            background: black;
            color: white;
        }

        .menu li:hover .submenu {
            display: block;
        }
    </style>
</head>
<body>

<ul class="menu">
    <li><a href="#">Home</a></li>

    <li>
        <a href="#">News</a>
        <ul class="submenu">
            <li><a href="#">Sports</a></li>
            <li><a href="#">Music</a></li>
            <li><a href="#">Movie</a></li>
        </ul>
    </li>

    <li><a href="#">Contact</a></li>
    <li><a href="#">About</a></li>
</ul>

</body>
</html>
