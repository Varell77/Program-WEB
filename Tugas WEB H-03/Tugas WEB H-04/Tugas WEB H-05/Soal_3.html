<!DOCTYPE html>
<html>
<head>
    <title>Layout Float</title>
    <style>
        body {
            margin: 0;
        }

        /* HEADER */
        .header {
            height: 80px;
            background: red;
        }

        /* BIRU */
        .kiri {
            width: 15%;
            height: 300px;
            background: blue;
            float: left;
        }

        /* HIJAU */
        .tengah {
            width: 85%;
            height: 350px;
            background: green;
            float: left;
            padding: 15px;
            box-sizing: border-box;

            border-left: 10px solid white;
            border-right: 10px solid white;
        }

        /* KUNING */
        .kuning {
            width: 140px;
            height: 150px;
            background: yellow;
            float: right;
            margin-top: 20px; /* dinaikkan */
        }

        /* TEXT */
        p {
            margin: 0;
            line-height: 1.8;
            font-size: 20px; /* diperbesar */
            font-weight: bold;
        }

        /* CLEAR */
        .clear {
            clear: both;
        }
    </style>
</head>

<body>

<div class="header"></div>

<div class="kiri"></div>

<div class="tengah">

    <div class="kuning"></div>

    <p>
        content content content content content content content content content content
        content content content content content content
    </p>
    <br>
    <p>
        content content content content content content content
    </p>

</div>

<div class="clear"></div>

</body>
</html>
