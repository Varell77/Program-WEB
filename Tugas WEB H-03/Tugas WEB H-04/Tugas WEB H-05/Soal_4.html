<!DOCTYPE html>
<html>
<head>
    <title>Navigation Bar</title>
    <style>
        body {
            margin: 0;
        }

        .nav {
            background: #AA0000;
            overflow: hidden;
        }

        .nav ul {
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .nav ul li {
            float: left;
            width: 180px;
            height: 100px;
            color: white;
            text-align: center;
            position: relative;

            /* background image kiri */
            background: url(nav_left.gif) top left no-repeat;

            /* garis pemisah */
            border-right: 2px solid white;
        }

        .nav ul li:last-child {
            border-right: none;
        }

        .nav ul li span {
            display: block;
        }

        .angka {
            font-size: 32px;
            font-weight: bold;
            margin-top: 20px;
        }

        .menu {
            font-size: 14px;
            margin-top: 5px;
        }

        /* garis kecil kuning */
        .menu::before {
            content: "▌";
            color: yellow;
            margin-right: 5px;
        }
    </style>
</head>

<body>

<div class="nav">
    <ul>
        <li>
            <span class="angka">01</span>
            <span class="menu">ABOUT SHOP</span>
        </li>
        <li>
            <span class="angka">02</span>
            <span class="menu">GALLERY</span>
        </li>
        <li>
            <span class="angka">03</span>
            <span class="menu">FREE MUSIC</span>
        </li>
        <li>
            <span class="angka">04</span>
            <span class="menu">ARTIST</span>
        </li>
        <li>
            <span class="angka">05</span>
            <span class="menu">CONTACTS</span>
        </li>
    </ul>
</div>

</body>
</html>
