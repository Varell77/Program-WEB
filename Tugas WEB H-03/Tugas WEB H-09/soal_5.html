<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Find Text JQuery</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>

        body{
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        .container{
            width: 320px;
            margin: 40px auto;
            padding: 10px;
            background: white;
            box-shadow: 0px 0px 15px gray;
        }

        #search{
            width: 210px;
            height: 25px;
            border: 1px solid #ccc;
            margin-bottom: 10px;
            padding-left: 5px;
        }

        ul{
            list-style: none;
            padding: 0;
            margin: 0;
        }

        li{
            font-size: 18px;
            margin: 4px 0;
            color: black;
        }

        .merah{
            color: red;
        }

    </style>
</head>

<body>

    <div class="container">

        <input type="text" id="search">

        <ul>
            <li>Sun Microsystem</li>
            <li>Apache Software Foundation</li>
            <li>Oracle Coorporation</li>
            <li>International Bussiness Machines</li>
            <li>Microsoft Coorporation</li>
            <li>Apple Inc</li>
            <li>Sap Ag</li>
            <li>Accenture</li>
            <li>Computer Sciences Coorporation</li>
            <li>Google</li>
            <li>Softbank</li>
            <li>Yahoo</li>
        </ul>

    </div>

    <script>

        $("#search").keyup(function(){

            var cari = $(this).val().toLowerCase();

            $("li").each(function(){

                var text = $(this).text().toLowerCase();

                $(this).removeClass("merah");

                if(text.indexOf(cari) != -1 && cari != ""){

                    $(this).addClass("merah");

                }

            });

        });

    </script>

</body>
</html>
