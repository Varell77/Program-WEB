<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Tambah dan Search Nama</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        body{
            font-family: Arial, sans-serif;
        }

        .box{
            width: 300px;
            margin: 50px auto;
            padding: 10px;
            background: #eee;
            box-shadow: 0px 0px 10px gray;
        }

        input{
            width: 160px;
            height: 25px;
        }

        button{
            height: 30px;
        }

        #daftarNama div{
            margin-top: 5px;
            font-size: 22px;
        }

        .garisbawah{
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="box">

    <input type="text" id="nama">
    <button id="add">Add</button>
    <button id="search">Search</button>

    <div id="daftarNama">
        <div>John Resig</div>
        <div>George Martin</div>
        <div>Malcom John Sinclair</div>
        <div>J. Ohn</div>
    </div>

</div>

<script>

$(document).ready(function(){

    $("#add").click(function(){

        var isi = $("#nama").val();

        if(isi != ""){
            $("#daftarNama").append("<div>" + isi + "</div>");
            $("#nama").val("");
        }

    });

    $("#search").click(function(){

        var cari = $("#nama").val();

        $("#daftarNama div").removeClass("garisbawah");

        $("#daftarNama div:contains('" + cari + "')")
        .addClass("garisbawah");

    });

});

</script>

</body>
</html>
