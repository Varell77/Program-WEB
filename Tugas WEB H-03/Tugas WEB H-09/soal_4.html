<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Checkbox Table</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>

        body{
            font-family: Times New Roman;
        }

        .kotak{
            width: 120px;
            padding: 15px;
            margin: 40px auto;
            border: 1px solid #ccc;
            box-shadow: 0px 0px 15px gray;
            background: white;
        }

        table{
            border-collapse: collapse;
            margin: auto;
        }

        td{
            width: 60px;
            text-align: center;
            padding: 0;
        }

        .header-box{
            border-bottom: 1px solid black;
            padding: 10px 0;
        }

        .body-box{
            padding: 10px 0;
        }

        input[type=checkbox]{
            width: 20px;
            height: 20px;
        }

    </style>
</head>

<body>

    <div class="kotak">

        <table border="1" cellspacing="0" cellpadding="0">

            <tr>
                <td class="header-box">

                    <input class="header" type="checkbox">

                </td>
            </tr>

            <tr>
                <td class="body-box">

                    <input class="body" type="checkbox">
                    <br><br>

                    <input class="body" type="checkbox">
                    <br><br>

                    <input class="body" type="checkbox">
                    <br><br>

                    <input class="body" type="checkbox">
                    <br><br>

                    <input class="body" type="checkbox">

                </td>
            </tr>

        </table>

    </div>

    <script>

        $(".header").click(function(){

            var flag = $(this).prop("checked");

            if(flag == true){

                $("input:checkbox.body").prop("checked", true);

            }

            else{

                $("input:checkbox.body").prop("checked", false);

            }

        });

    </script>

</body>
</html>
